<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #msg {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center;
    font: 13px 'JetBrains Mono', monospace;
    color: rgba(255,255,255,0.25);
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg">Load a session to see the race replay</div>
<script>
/* ─────────────────────────────────────────────────────────────────────────────
   F1 Replay Canvas Engine
   Receives data from parent window via postMessage:
     { type: "LOAD",  data: { track_x, track_y, frames, drivers, colors, total_laps } }
     { type: "PLAY"  }
     { type: "PAUSE" }
     { type: "RESET" }
     { type: "SEEK",  frame: N }
   Posts back to parent:
     { type: "FRAME", idx, lap, time, leaderboard: [{drv, speed, color}] }
     { type: "DONE"  }
───────────────────────────────────────────────────────────────────────────── */

const canvas = document.getElementById('c');
const ctx2d  = canvas.getContext('2d');
const msg    = document.getElementById('msg');

let DATA       = null;
let frameIdx   = 0;
let playing    = false;
let rafHandle  = null;
let lastTs     = null;
const MS_PER_FRAME = 180; // advance one logical frame every 100ms → ~10fps logical, 60fps visual

// ── Resize handling ──────────────────────────────────────────────────────────
function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = canvas.clientWidth  * dpr;
  canvas.height = canvas.clientHeight * dpr;
  ctx2d.scale(dpr, dpr);
  if (DATA) drawFrame(frameIdx);
}
window.addEventListener('resize', resize);
setTimeout(resize, 50);

// ── Receive messages from parent (Dash) ──────────────────────────────────────
window.addEventListener('message', (e) => {
  const m = e.data;
  if (!m || !m.type) return;
  switch (m.type) {
    case 'LOAD':
      DATA     = m.data;
      frameIdx = 0;
      msg.style.display = 'none';
      resize();
      drawFrame(0);
      break;
    case 'PLAY':
      if (!DATA) return;
      playing  = true;
      lastTs   = null;
      if (!rafHandle) rafHandle = requestAnimationFrame(tick);
      break;
    case 'PAUSE':
      playing = false;
      if (rafHandle) { cancelAnimationFrame(rafHandle); rafHandle = null; }
      break;
    case 'RESET':
      playing  = false;
      frameIdx = 0;
      if (rafHandle) { cancelAnimationFrame(rafHandle); rafHandle = null; }
      if (DATA) drawFrame(0);
      postParent(0);
      break;
    case 'SEEK':
      frameIdx = Math.max(0, Math.min(m.frame, DATA ? DATA.frames.length - 1 : 0));
      if (DATA) drawFrame(frameIdx);
      break;
  }
});

// ── Animation loop ───────────────────────────────────────────────────────────
function tick(ts) {
  if (!playing || !DATA) { rafHandle = null; return; }
  rafHandle = requestAnimationFrame(tick);

  if (lastTs === null) { lastTs = ts; return; }
  if (ts - lastTs < MS_PER_FRAME) return;
  lastTs = ts;

  frameIdx++;
  if (frameIdx >= DATA.frames.length) {
    frameIdx = DATA.frames.length - 1;
    playing  = false;
    if (rafHandle) { cancelAnimationFrame(rafHandle); rafHandle = null; }
    window.parent.postMessage({ type: 'DONE' }, '*');
  }

  drawFrame(frameIdx);
  postParent(frameIdx);
}

function postParent(idx) {
  if (!DATA) return;
  const frame  = DATA.frames[idx];
  const total  = DATA.frames.length;
  const laps   = DATA.total_laps || 1;
  const lapNow = Math.max(1, Math.min(laps, Math.floor(idx / total * laps) + 1));
  const tSec   = frame.t || 0;
  const m      = Math.floor(tSec / 60);
  const s      = Math.floor(tSec % 60);
  const cs     = Math.floor((tSec % 1) * 100);
  const tFmt   = pad2(m) + ':' + pad2(s) + '.' + pad2(cs);

  const lb = DATA.drivers
    .map(d => ({ drv: d, speed: (frame.d[d] || {}).speed || 0, color: DATA.colors[d] || '#888' }))
    .sort((a, b) => b.speed - a.speed);

  window.parent.postMessage({
    type: 'FRAME', idx, lap: lapNow, time: tFmt,
    leaderboard: lb, total: DATA.frames.length
  }, '*');
}

function pad2(n) { return String(Math.floor(n)).padStart(2, '0'); }

// ── Drawing ──────────────────────────────────────────────────────────────────
const W = () => canvas.clientWidth;
const H = () => canvas.clientHeight;
const TRAIL = 8; // trail length in frames

// Pre-parse team colors to rgb arrays for speed
const _rgb = {};
function getRGB(hex) {
  if (_rgb[hex]) return _rgb[hex];
  const h = hex.replace('#', '');
  _rgb[hex] = [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
  return _rgb[hex];
}

function wx(nx) { return nx * W(); }
function wy(ny) { return (1 - ny) * H(); }  // flip Y so track isn't upside-down

function drawFrame(idx) {
  if (!DATA) return;
  const w = W(), h = H();
  ctx2d.clearRect(0, 0, w, h);

  const frames  = DATA.frames;
  const frame   = frames[Math.min(idx, frames.length - 1)];
  const drivers = DATA.drivers;
  const colors  = DATA.colors;
  const tx      = DATA.track_x;
  const ty      = DATA.track_y;

  // ── Track outline ──────────────────────────────────────────────────────────
  if (tx && tx.length > 1) {
    // Wide glow
    ctx2d.beginPath();
    ctx2d.moveTo(wx(tx[0]), wy(ty[0]));
    for (let i = 1; i < tx.length; i++) ctx2d.lineTo(wx(tx[i]), wy(ty[i]));
    ctx2d.strokeStyle = 'rgba(232,0,45,0.07)';
    ctx2d.lineWidth   = 28;
    ctx2d.lineJoin    = 'round';
    ctx2d.lineCap     = 'round';
    ctx2d.stroke();

    // Mid glow
    ctx2d.beginPath();
    ctx2d.moveTo(wx(tx[0]), wy(ty[0]));
    for (let i = 1; i < tx.length; i++) ctx2d.lineTo(wx(tx[i]), wy(ty[i]));
    ctx2d.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx2d.lineWidth   = 14;
    ctx2d.stroke();

    // Sharp line
    ctx2d.beginPath();
    ctx2d.moveTo(wx(tx[0]), wy(ty[0]));
    for (let i = 1; i < tx.length; i++) ctx2d.lineTo(wx(tx[i]), wy(ty[i]));
    ctx2d.strokeStyle = 'rgba(255,255,255,0.20)';
    ctx2d.lineWidth   = 2;
    ctx2d.stroke();
  }

  // ── Trails ─────────────────────────────────────────────────────────────────
  for (const drv of drivers) {
    const col = colors[drv] || '#888888';
    const [r, g, b] = getRGB(col);
    for (let seg = 0; seg < TRAIL - 1; seg++) {
      const fi0 = Math.max(0, idx - TRAIL + seg);
      const fi1 = Math.max(0, idx - TRAIL + seg + 1);
      const p0  = frames[fi0].d[drv];
      const p1  = frames[fi1].d[drv];
      if (!p0 || !p1) continue;
      const alpha = ((seg + 1) / TRAIL) * 0.5;
      const lw    = 1.5 + seg * 0.4;
      ctx2d.beginPath();
      ctx2d.moveTo(wx(p0.x), wy(p0.y));
      ctx2d.lineTo(wx(p1.x), wy(p1.y));
      ctx2d.strokeStyle = `rgba(${r},${g},${b},${alpha.toFixed(2)})`;
      ctx2d.lineWidth   = lw;
      ctx2d.lineCap     = 'round';
      ctx2d.stroke();
    }
  }

  // ── Driver dots ─────────────────────────────────────────────────────────────
  for (const drv of drivers) {
    const pt  = frame.d[drv];
    if (!pt) continue;
    const col = colors[drv] || '#888888';
    const [r, g, b] = getRGB(col);
    const x = wx(pt.x), y = wy(pt.y);

    // Halo
    ctx2d.beginPath();
    ctx2d.arc(x, y, 11, 0, Math.PI * 2);
    ctx2d.fillStyle = `rgba(${r},${g},${b},0.15)`;
    ctx2d.fill();

    // Dot
    ctx2d.beginPath();
    ctx2d.arc(x, y, 6, 0, Math.PI * 2);
    ctx2d.fillStyle = col;
    ctx2d.fill();
    ctx2d.strokeStyle = 'rgba(0,0,0,0.85)';
    ctx2d.lineWidth   = 1.5;
    ctx2d.stroke();

    // Label
    ctx2d.font         = 'bold 8px "JetBrains Mono", monospace';
    ctx2d.fillStyle    = 'rgba(255,255,255,0.9)';
    ctx2d.textAlign    = 'center';
    ctx2d.textBaseline = 'bottom';
    ctx2d.fillText(drv, x, y - 9);
  }
}
</script>
</body>
</html>
