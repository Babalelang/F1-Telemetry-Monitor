<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:transparent; overflow:hidden; }
  #c { display:block; width:100%; height:100%; }
  #msg {
    position:absolute; inset:0; display:flex; align-items:center;
    justify-content:center; font:13px 'JetBrains Mono',monospace;
    color:rgba(255,255,255,0.25); pointer-events:none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg">Load a session to see the race replay</div>
<script>
/* ─────────────────────────────────────────────────────────────────────────
   F1 Replay Canvas — v4  "smooth edition"

   ROOT CAUSE OF LAG/SPEED-BURST (now fixed):
   The old code used:
       while (logicalAcc >= MS_PER_FRAME) { logicalAcc -= MS_PER_FRAME; frameIdx++; }
   When the browser delivered a late RAF tick (GPU stall, GC, tab switch)
   the while-loop burned through many logical frames at once → visible
   speed burst.  The fix is:
       dt = Math.min(dt, MS_PER_FRAME)   ← cap to exactly one frame max
   Combined with fractional sub-frame interpolation this gives perfectly
   smooth, correctly-paced motion at any real frame rate.

   Architecture:
   • Logical clock  — advances at exactly PLAYBACK_SPEED × real time
   • Sub-frame lerp — visual positions interpolated between logical frames
   • Track cache    — drawn once to OffscreenCanvas, blit every RAF
   • Leaderboard    — postMessage throttled to 4 Hz (not every RAF)
   • Gap detection  — trail broken when normalised jump > MAX_JUMP
──────────────────────────────────────────────────────────────────────── */

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d', { alpha: true });
const msgEl  = document.getElementById('msg');

// ── Tuning ────────────────────────────────────────────────────────────────
const PLAYBACK_SPEED = 1.0;   // 1 = real-time (adjust if race data is dense)
const FRAMES_PER_SEC = 10;    // logical frames per second of playback
const MS_PER_LFRAME  = 1000 / FRAMES_PER_SEC;  // ms between logical frames
const MAX_JUMP       = 0.08;  // normalised units — larger = teleport, skip trail
const TRAIL_LEN      = 12;    // frames of trail history
const DOT_R          = 5;
const HALO_R         = 12;
const LB_HZ          = 4;     // leaderboard postMessage rate (Hz)
const DPR            = Math.min(window.devicePixelRatio || 1, 2);

// ── State ─────────────────────────────────────────────────────────────────
let DATA         = null;
let logicalTime  = 0;    // fractional logical frame index (float)
let playing      = false;
let rafHandle    = null;
let lastPerfTs   = null; // performance.now() at last RAF
let trackBitmap  = null; // pre-rendered track ImageBitmap
let lbLastSent   = 0;    // perf timestamp of last leaderboard postMessage

// ── RGB cache ─────────────────────────────────────────────────────────────
const _rgb = {};
function toRGB(hex) {
  if (_rgb[hex]) return _rgb[hex];
  const h = (hex || '#888888').replace('#', '');
  _rgb[hex] = [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
  return _rgb[hex];
}

// ── Canvas resize ─────────────────────────────────────────────────────────
function resize() {
  const cw = canvas.clientWidth  || 800;
  const ch = canvas.clientHeight || 500;
  canvas.width  = cw * DPR;
  canvas.height = ch * DPR;
  // Note: scaling is applied per-draw via ctx.save/scale, not permanently,
  // because permanent ctx.scale is lost on resize.
  buildTrackCache();
  if (DATA) renderFrame();
}
window.addEventListener('resize', resize);
setTimeout(resize, 80);

// Shorthand — logical (CSS) pixel size
function CW() { return canvas.width  / DPR; }
function CH() { return canvas.height / DPR; }

// ── Coordinate mapping ────────────────────────────────────────────────────
// Data coords are 0..1 (already normalised by Python).
// We add 5% padding on each side and flip Y so north is up.
const PAD = 0.05;
function wx(nx) { return (PAD + nx * (1 - 2*PAD)) * CW(); }
function wy(ny) { return (1 - PAD - ny * (1 - 2*PAD)) * CH(); }

// ── Track pre-render ──────────────────────────────────────────────────────
function buildTrackCache() {
  trackBitmap = null;
  if (!DATA || !DATA.track_x || DATA.track_x.length < 4) return;

  const w = CW(), h = CH();
  const offscreen = document.createElement('canvas');
  offscreen.width  = w * DPR;
  offscreen.height = h * DPR;
  const tc = offscreen.getContext('2d');
  tc.scale(DPR, DPR);

  const tx = DATA.track_x, ty = DATA.track_y;

  function tracePath() {
    tc.beginPath();
    tc.moveTo(wx(tx[0]), wy(ty[0]));
    for (let i = 1; i < tx.length; i++) tc.lineTo(wx(tx[i]), wy(ty[i]));
  }

  // Red glow
  tracePath();
  tc.strokeStyle = 'rgba(232,0,45,0.07)';
  tc.lineWidth = 34; tc.lineJoin = 'round'; tc.lineCap = 'round'; tc.stroke();

  // Road surface (dark fill to occlude glow underneath)
  tracePath();
  tc.strokeStyle = 'rgba(16,18,26,0.95)';
  tc.lineWidth = 20; tc.stroke();

  // Edge highlight
  tracePath();
  tc.strokeStyle = 'rgba(255,255,255,0.17)';
  tc.lineWidth = 2; tc.stroke();

  // Centre line
  tracePath();
  tc.setLineDash([8, 18]);
  tc.strokeStyle = 'rgba(255,255,255,0.06)';
  tc.lineWidth = 1; tc.stroke();
  tc.setLineDash([]);

  trackBitmap = offscreen;
}

// ── Distance helper ───────────────────────────────────────────────────────
function dist(a, b) {
  if (!a || !b) return 999;
  const dx = a.x - b.x, dy = a.y - b.y;
  return Math.sqrt(dx*dx + dy*dy);
}

// ── Linear interpolation with teleport guard ──────────────────────────────
function lerpPos(a, b, t) {
  if (!a || !b) return a || b;
  if (dist(a, b) > MAX_JUMP) return a; // teleport — hold current position
  return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, speed: a.speed };
}

// ── Main render ───────────────────────────────────────────────────────────
function renderFrame() {
  if (!DATA) return;
  const W = CW(), H = CH();
  const total   = DATA.frames.length;
  const drivers = DATA.drivers;
  const colors  = DATA.colors;

  // Integer frame index + fractional sub-frame
  const fi0  = Math.min(Math.floor(logicalTime), total - 1);
  const fi1  = Math.min(fi0 + 1, total - 1);
  const frac = logicalTime - Math.floor(logicalTime);

  const curFr  = DATA.frames[fi0];
  const nextFr = DATA.frames[fi1];

  // Pre-compute interpolated positions
  const pos = {};
  for (const d of drivers) {
    pos[d] = lerpPos(curFr.d[d], nextFr.d[d], frac);
  }

  // Clear
  ctx.save();
  ctx.scale(DPR, DPR);
  ctx.clearRect(0, 0, W, H);

  // Track blit
  if (trackBitmap) {
    ctx.drawImage(trackBitmap, 0, 0, W, H);
  }

  // ── Trails ───────────────────────────────────────────────────────────────
  for (const drv of drivers) {
    if (!pos[drv]) continue;
    const [r,g,b] = toRGB(colors[drv] || '#888888');
    let prev = pos[drv];

    for (let back = 1; back <= TRAIL_LEN; back++) {
      const fi = Math.max(0, fi0 - back);
      const curr = DATA.frames[fi].d[drv];
      if (!curr || !prev) { prev = curr; continue; }
      if (dist(curr, prev) > MAX_JUMP) { prev = curr; continue; } // break on teleport

      const alpha = ((TRAIL_LEN - back) / TRAIL_LEN) * 0.5;
      const lw    = 1.0 + ((TRAIL_LEN - back) / TRAIL_LEN) * 2.2;
      ctx.beginPath();
      ctx.moveTo(wx(prev.x), wy(prev.y));
      ctx.lineTo(wx(curr.x), wy(curr.y));
      ctx.strokeStyle = `rgba(${r},${g},${b},${alpha.toFixed(2)})`;
      ctx.lineWidth   = lw;
      ctx.lineCap     = 'round';
      ctx.stroke();
      prev = curr;
    }
  }

  // ── Halos ─────────────────────────────────────────────────────────────────
  for (const drv of drivers) {
    const pt = pos[drv]; if (!pt) continue;
    const [r,g,b] = toRGB(colors[drv] || '#888888');
    const x = wx(pt.x), y = wy(pt.y);
    const g2 = ctx.createRadialGradient(x, y, 0, x, y, HALO_R);
    g2.addColorStop(0, `rgba(${r},${g},${b},0.30)`);
    g2.addColorStop(1, `rgba(${r},${g},${b},0)`);
    ctx.beginPath();
    ctx.arc(x, y, HALO_R, 0, Math.PI*2);
    ctx.fillStyle = g2;
    ctx.fill();
  }

  // ── Dots ──────────────────────────────────────────────────────────────────
  for (const drv of drivers) {
    const pt = pos[drv]; if (!pt) continue;
    const x = wx(pt.x), y = wy(pt.y);
    ctx.beginPath();
    ctx.arc(x, y, DOT_R, 0, Math.PI*2);
    ctx.fillStyle   = colors[drv] || '#888888';
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.9)';
    ctx.lineWidth   = 1.5;
    ctx.stroke();
  }

  // ── Labels ────────────────────────────────────────────────────────────────
  ctx.font         = `bold ${7 * DPR / DPR}px "JetBrains Mono",monospace`;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'bottom';
  for (const drv of drivers) {
    const pt = pos[drv]; if (!pt) continue;
    const x = wx(pt.x), y = wy(pt.y);
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillText(drv, x + 0.5, y - DOT_R - 2.5);
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.fillText(drv, x, y - DOT_R - 3);
  }

  ctx.restore();
}

// ── Leaderboard (throttled postMessage) ───────────────────────────────────
function maybePostLeaderboard(now) {
  if (now - lbLastSent < 1000 / LB_HZ) return;
  lbLastSent = now;
  if (!DATA) return;

  const total  = DATA.frames.length;
  const fi0    = Math.min(Math.floor(logicalTime), total - 1);
  const frame  = DATA.frames[fi0];
  const laps   = DATA.total_laps || 1;
  const lapNow = Math.max(1, Math.min(laps, Math.floor(fi0 / total * laps) + 1));
  const tSec   = frame.t || 0;
  const tFmt   = pad2(tSec / 60) + ':' + pad2(tSec % 60) + '.' + pad2((tSec % 1) * 100);

  const lb = DATA.drivers
    .map(d => ({ drv: d, speed: (frame.d[d]||{}).speed||0, color: DATA.colors[d]||'#888' }))
    .sort((a, b) => b.speed - a.speed);

  window.parent.postMessage({
    type: 'FRAME', idx: fi0, lap: lapNow, time: tFmt,
    leaderboard: lb, total
  }, '*');
}

function pad2(n) { return String(Math.floor(n < 0 ? 0 : n)).padStart(2, '0'); }

// ── Animation loop — THE KEY FIX ─────────────────────────────────────────
// dt is CAPPED to MS_PER_LFRAME so a late RAF tick never skips frames.
// There is NO while-loop. One RAF tick = at most one logical frame advance.
function tick(perfTs) {
  if (!playing || !DATA) { rafHandle = null; return; }
  rafHandle = requestAnimationFrame(tick);

  const now = performance.now();

  if (lastPerfTs === null) {
    lastPerfTs = perfTs;
    renderFrame();
    return;
  }

  // ── THE FIX: cap dt so we never catch-up across multiple frames ──────────
  let dt = (perfTs - lastPerfTs) * PLAYBACK_SPEED;
  dt = Math.min(dt, MS_PER_LFRAME);  // ← never advance more than 1 logical frame
  lastPerfTs = perfTs;

  // Advance the fractional logical clock
  logicalTime += dt / MS_PER_LFRAME;

  const total = DATA.frames.length;
  if (logicalTime >= total - 1) {
    logicalTime = total - 1;
    playing     = false;
    if (rafHandle) { cancelAnimationFrame(rafHandle); rafHandle = null; }
    renderFrame();
    window.parent.postMessage({ type: 'DONE' }, '*');
    return;
  }

  renderFrame();
  maybePostLeaderboard(now);
}

// ── Message API ───────────────────────────────────────────────────────────
window.addEventListener('message', (e) => {
  const m = e.data;
  if (!m || !m.type) return;

  switch (m.type) {
    case 'LOAD':
      DATA        = m.data;
      logicalTime = 0;
      playing     = false;
      lbLastSent  = 0;
      if (rafHandle) { cancelAnimationFrame(rafHandle); rafHandle = null; }
      msgEl.style.display = 'none';
      _normalise();
      resize();       // also calls buildTrackCache + renderFrame
      break;

    case 'PLAY':
      if (!DATA || logicalTime >= DATA.frames.length - 1) {
        logicalTime = 0; // auto-restart if at end
      }
      playing    = true;
      lastPerfTs = null;
      if (!rafHandle) rafHandle = requestAnimationFrame(tick);
      break;

    case 'PAUSE':
      playing = false;
      if (rafHandle) { cancelAnimationFrame(rafHandle); rafHandle = null; }
      break;

    case 'RESET':
      playing     = false;
      logicalTime = 0;
      if (rafHandle) { cancelAnimationFrame(rafHandle); rafHandle = null; }
      if (DATA) { renderFrame(); maybePostLeaderboard(0); }
      break;

    case 'SEEK':
      logicalTime = Math.max(0, Math.min(m.frame, DATA ? DATA.frames.length - 1 : 0));
      if (DATA) renderFrame();
      break;
  }
});

// ── Normalise raw coordinates if needed ──────────────────────────────────
// Python already normalises, but this handles any edge case where raw
// FastF1 coords (metres) are passed through unnormalised.
function _normalise() {
  if (!DATA) return;
  const tx = DATA.track_x, ty = DATA.track_y;
  const sample = tx && tx.length ? tx[0] : null;
  // If already in 0..1 range, skip
  if (sample !== null && sample >= -0.01 && sample <= 1.01) return;

  let mnX = Infinity, mxX = -Infinity, mnY = Infinity, mxY = -Infinity;
  if (tx) for (let i = 0; i < tx.length; i++) {
    if (tx[i] < mnX) mnX = tx[i]; if (tx[i] > mxX) mxX = tx[i];
    if (ty[i] < mnY) mnY = ty[i]; if (ty[i] > mxY) mxY = ty[i];
  }
  for (const fr of DATA.frames) {
    for (const d of DATA.drivers) {
      const p = fr.d[d]; if (!p) continue;
      if (p.x < mnX) mnX = p.x; if (p.x > mxX) mxX = p.x;
      if (p.y < mnY) mnY = p.y; if (p.y > mxY) mxY = p.y;
    }
  }
  const rng = Math.max(mxX - mnX, mxY - mnY) || 1;
  if (tx) for (let i = 0; i < tx.length; i++) {
    DATA.track_x[i] = (tx[i] - mnX) / rng;
    DATA.track_y[i] = (ty[i] - mnY) / rng;
  }
  for (const fr of DATA.frames) {
    for (const d of DATA.drivers) {
      const p = fr.d[d]; if (!p) continue;
      p.x = (p.x - mnX) / rng;
      p.y = (p.y - mnY) / rng;
    }
  }
}
</script>
</body>
</html>
